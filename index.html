<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translator UI</title>
</head>
<body>
    <h1>Language Translator</h1>
    <form>
        <fieldset>
            <div class="container">
                <label for="language">Select the language you give as input</label>
                <select>
                    <option disabled selected>Select Language</option>
                    <option>Tamil</option>
                    <option>English</option>
                    <option>Hindi</option>
                </select>
            </div>
        </fieldset>
        <fieldset>
            <div class="container">
                <label for="language">Select the language you want to translate to</label>
                <select>
                    <option disabled selected>Select Language</option>
                    <option>Tamil</option>
                    <option>English</option>
                    <option>Hindi</option>
                </select>
            </div>
        </fieldset>
        <button type="submit">translate</button>
    </form>
</body>
</html>
