<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translator UI</title>
    <link rel="icon" href="icon.avif">
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Rubik+Moonrocks&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Language Translator</h1>
    <form method="post">
        <fieldset>
            <div class="container">
                <label for="fromLanguage">Select the Input language</label>
                <select name="fromLanguage" id="fromLanguage">
                    <option disabled selected>Select Language</option>
                    <option value="tamil">Tamil</option>
                    <option value="english">English</option>
                    <option value="hindi">Hindi</option>
                </select>
            </div>
            <textarea name="fromLanguageText" id="fromLanguageText" placeholder="Enter the text here..." rows="5"></textarea>
        </fieldset>
        <fieldset>
            <div class="container">
                <label for="toLanguage">Select the Target language</label>
                <select name="toLanguage" id="toLanguage">
                    <option disabled selected>Select Language</option>
                    <option value="tamil">Tamil</option>
                    <option value="english">English</option>
                    <option value="hindi">Hindi</option>
                </select>
            </div>
            <textarea name="toLanguageText" id="toLanguageText" placeholder="Output" rows="5" readonly></textarea>
        </fieldset>
        <button type="button" id="translateButton">Translate</button>
    </form>

    <script>
        // Add event listener to the button to ensure the function is called
        document.getElementById("translateButton").addEventListener("click", doTranslate);

        function doTranslate() {
            let inputLanguage = document.getElementById("fromLanguage").value;
            let outputLanguage = document.getElementById("toLanguage").value;
            let inputText = document.getElementById("fromLanguageText").value;

            // Check if input text is empty
            if (inputText.trim() === "") {
                alert("Please enter text to translate!");
                return;
            }

            // Prepare data to send to the API
            let data = {
                q: inputText,
                source: inputLanguage,
                target: outputLanguage,
            };

            // Log input to verify if function is triggered
            console.log("Button clicked. Sending data:", data);

            // Make the API request to LibreTranslate
            fetch('https://libretranslate.de/translate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data),
            })
            .then(response => {
                // Log the full response object for debugging
                console.log("API Response:", response);

                // Check if the response is okay
                if (!response.ok) {
                    throw new Error("API request failed with status: " + response.status);
                }
                return response.json();
            })
            .then(data => {
                // Log the response data for debugging
                console.log("Translated Data:", data);

                // Check if the translatedText is available
                if (data.translatedText) {
                    let translatedText = data.translatedText;
                    document.getElementById("toLanguageText").value = translatedText;
                    console.log(`${inputLanguage} to ${outputLanguage}: ${translatedText}`);
                } else {
                    throw new Error("No translated text found in response");
                }
            })
            .catch(error => {
                // Handle any errors
                console.error("Error during translation:", error);
                alert("Something went wrong while translating. Please try again.");
            });
        }
    </script>
</body>
</html>
